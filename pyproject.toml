[project]
name = "behavior-scoring"
version = "0.1.0"
description = "LLM-based scoring pipeline for systematic review of psychedelic animal studies"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "google-genai>=1.64.0",
    "openai>=1.50",
    "requests>=2.32.5",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "playwright>=1.59.0",
    "matplotlib>=3.10.9",
    "bibtexparser>=1.4.4",
    "unidecode>=1.4.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]
